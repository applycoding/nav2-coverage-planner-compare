<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <title>nav2-coverage-planner-compare</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1419;
        --panel: #1a2332;
        --text: #e8eef5;
        --muted: #8b9cb3;
        --accent: #4ade80;
        --border: #2d3a4f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      #app { padding: 1rem 1.25rem 2rem; max-width: 1200px; margin: 0 auto; }
      h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.25rem; }
      .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin-bottom: 1rem; }
      label { font-size: 0.85rem; display: flex; align-items: center; gap: 0.35rem; }
      select, button {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.35rem 0.6rem;
        font-size: 0.85rem;
      }
      button { cursor: pointer; }
      button:hover { border-color: var(--accent); }
      .layout { display: grid; grid-template-columns: 1fr 280px; gap: 1rem; }
      @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
      .canvas-wrap {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        min-height: 420px;
        display: flex;
        flex-direction: column;
      }
      #canvas { width: 100%; flex: 1; display: block; background: #0a0e12; }
      .side { display: flex; flex-direction: column; gap: 0.75rem; }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.75rem;
        font-size: 0.8rem;
      }
      .card h2 { margin: 0 0 0.5rem; font-size: 0.9rem; font-weight: 600; }
      .metrics-line { margin: 0.15rem 0; font-family: ui-monospace, monospace; font-size: 0.75rem; }
      .legend { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 0.5rem; }
      .swatch { width: 14px; height: 14px; border-radius: 2px; border: 1px solid #0004; }
      table.compare { width: 100%; border-collapse: collapse; font-size: 0.72rem; }
      table.compare th, table.compare td { text-align: left; padding: 0.2rem 0.25rem; border-bottom: 1px solid var(--border); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
