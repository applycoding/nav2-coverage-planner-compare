# SPDX-License-Identifier: Apache-2.0
name: ros2-humble

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, labeled]

jobs:
  humble:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci-ros')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ros:humble-ros-base@sha256:a3f4de78e42cca693a543ece5798aedcf1cae0171fe71c334a047332cc72ef93
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y python3-pip cmake g++ libyaml-cpp-dev
          apt-get install -y ros-humble-rclcpp ros-humble-nav-msgs \
            ros-humble-geometry-msgs ros-humble-visualization-msgs \
            ros-humble-rosidl-default-generators ros-humble-rosidl-default-runtime \
            ros-humble-ament-cmake
      - name: Build and install core
        run: |
          mkdir -p /opt/ncp
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNCP_BUILD_PYTHON=OFF \
            -DNCP_BUILD_TESTS=OFF -DNCP_BUILD_ROS=OFF -DCMAKE_INSTALL_PREFIX=/opt/ncp
          cmake --build build -j$(nproc)
          cmake --install build
      - name: Colcon build wrapper
        run: |
          . /opt/ros/humble/setup.sh
          export CMAKE_PREFIX_PATH=/opt/ncp:$CMAKE_PREFIX_PATH
          colcon build --paths ros2/ncp_planner --cmake-args -DCMAKE_PREFIX_PATH=/opt/ncp
      - name: Smoke
        timeout-minutes: 3
        run: |
          . /opt/ros/humble/setup.sh
          . install/setup.sh
          ros2 run ncp_planner ncp_planner_node &
          sleep 2
          python3 ros2/ncp_planner/scripts/smoke_plan_global.py
